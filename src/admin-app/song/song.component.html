<div class="container mx-auto p-4">
  <h1 class="text-2xl mb-4 text-amber-500 font-bold">歌曲管理</h1>

  <form class="mb-4 " (ngSubmit)="addOrUpdateItem()">
    <div class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-3">
      <div>
        <label class="block mb-1">名称</label>
        <input class="w-full p-2 border rounded" [(ngModel)]="selectedItem.realName" name="real_name"/>
      </div>
      <div>
        <label class="block mb-1">歌手</label>
        <input class="w-full p-2 border rounded" [(ngModel)]="selectedItem.artist" name="artist"/>
      </div>
      <div>
        <label class="block mb-1">文件地址</label>
        <input class="w-full p-2 border rounded" [(ngModel)]="selectedItem.fileUrl" name="file_url"/>
      </div>
      <div>
        <label class="block mb-1">类型</label>
        <input class="w-full p-2 border rounded" [(ngModel)]="selectedItem.genre" name="genre" type="number"/>
      </div>
    </div>
    <button class="mt-4 p-2 bg-blue-500 text-white rounded" type="submit">提交</button>
  </form>

  <table class="min-w-full bg-white">
    <thead>
    <tr>
      <th class="text-left py-2 px-4 border-b">ID</th>
      <th class="text-left py-2 px-4 border-b">真实姓名</th>
      <th class="text-left py-2 px-4 border-b">歌手</th>
      <th class="text-left py-2 px-4 border-b">文件名</th>
      <th class="text-left py-2 px-4 border-b">点击量</th>
      <th class="text-left py-2 px-4 border-b">类型</th>
      <th class="text-left py-2 px-4 border-b">操作</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let item of items">
      <td class="text-left py-2 px-4 border-b">{{ item.id }}</td>
      <td class="text-left py-2 px-4 border-b">{{ item.realName }}</td>
      <td class="text-left py-2 px-4 border-b">{{ item.artist }}</td>
      <td class="text-left py-2 px-4 border-b">{{ item.fileUrl }}</td>
      <td class="text-left py-2 px-4 border-b">{{ item.hits }}</td>
      <td class="text-left py-2 px-4 border-b">华语</td>
      <td class="text-left py-2 px-4 border-b">
        <button class="p-2 bg-yellow-500 text-white rounded mr-2" (click)="editItem(item)">编辑</button>
        <button class="p-2 bg-red-500 text-white rounded" (click)="deleteItem(item.id)">删除</button>
      </td>
    </tr>
    </tbody>
  </table>
</div>
