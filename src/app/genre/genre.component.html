<div class="flex justify-center gap-4 w-3/4">
  <button type="button"
          class="rounded-lg border border-yellow-500 bg-yellow-500 px-4 py-1 text-center text-sm font-medium text-white shadow-sm transition duration-300
                     hover:scale-110 hover:border-yellow-700 hover:bg-yellow-700
                      focus:ring focus:ring-yellow-200
                      disabled:cursor-not-allowed
                      disabled:border-yellow-300
                      disabled:bg-yellow-300">
    全部
  </button>
  <button type="button"
          class="rounded-lg border border-yellow-500 bg-yellow-500 px-4 py-1 text-center text-sm font-medium text-white shadow-sm transition duration-300
                     hover:scale-110 hover:border-yellow-700 hover:bg-yellow-700
                      focus:ring focus:ring-yellow-200
                      disabled:cursor-not-allowed
                      disabled:border-yellow-300
                      disabled:bg-yellow-300">
    华语
  </button>
  <button type="button"
          class="rounded-lg border border-yellow-500 bg-yellow-500 px-4 py-1 text-center text-sm font-medium text-white shadow-sm transition duration-300
                     hover:scale-110 hover:border-yellow-700 hover:bg-yellow-700
                      focus:ring focus:ring-yellow-200
                      disabled:cursor-not-allowed
                      disabled:border-yellow-300
                      disabled:bg-yellow-300">
    欧美
  </button>
  <button type="button"
          class="rounded-lg border border-yellow-500 bg-yellow-500 px-4 py-1 text-center text-sm font-medium text-white shadow-sm transition duration-300
                     hover:scale-110 hover:border-yellow-700 hover:bg-yellow-700
                      focus:ring focus:ring-yellow-200
                      disabled:cursor-not-allowed
                      disabled:border-yellow-300
                      disabled:bg-yellow-300">
    日语
  </button>
  <button type="button"
          class="rounded-lg border border-yellow-500 bg-yellow-500 px-4 py-1 text-center text-sm font-medium text-white shadow-sm transition duration-300
                     hover:scale-110 hover:border-yellow-700 hover:bg-yellow-700
                      focus:ring focus:ring-yellow-200
                      disabled:cursor-not-allowed
                      disabled:border-yellow-300
                      disabled:bg-yellow-300">
    其他
  </button>
</div>

<div>
  <div class="w-100 border-t border-gray-400 mt-4 mb-4"></div>

  <section>
    <ul class="result-list">
      @for (item of genreResult; track item) {
        <li class="list-item flex items-center">
          <div class="flex-1 mr-2">{{ item.title }}</div>
          <div class="mr-2">{{ item.artist }}</div>
          <div class="mr-2">{{ item.genre }}</div>
          <div>{{ item.hits }}</div>
        </li>
      }
    </ul>
  </section>
</div>
