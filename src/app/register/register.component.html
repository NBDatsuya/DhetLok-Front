<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>音乐在线系统 - 用户注册</title>
  </head>
  <body>
    <div class="container">
      <div class="register-form">
        <h2 class="form-title">注册新账户</h2>
        <div class="form-field">
          <label for="username">用户名：</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="请输入用户名"
            required
          />
        </div>
        <div class="form-field">
          <label for="password">密码：</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="请输入密码"
            required
          />
        </div>
        <button type="submit">注册</button>
      </div>
    </div>
  </body>
</html>
