<div class="container">
  <div class="login-form">
    <h2 style="font-size: 24px; font-weight: bold;">后台登录</h2>
    <form>
      <input
        type="text"
        id="username"
        name="username"
        placeholder="用户名"
        required
      />
      <input
        type="password"
        id="password"
        name="password"
        placeholder="密码"
        required
      />
    </form>
    <div>
      <button (click)="alert('dfdf')" class="register-button">登陆</button>
    </div>
  </div>
</div>
